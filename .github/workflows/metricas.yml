name: Métricas de reels
on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  workflow_dispatch:
permissions:
  contents: write
concurrency: metricas
jobs:
  metricas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar métricas
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/metricas.py
      - name: Guardar
        run: |
          git config user.name "raro-pero-cierto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add metricas/ || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Métricas actualizadas"
          for i in 1 2 3 4; do git pull --rebase -q && git push && exit 0; sleep $((i*10)); done
          exit 1
